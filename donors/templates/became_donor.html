
{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
    
.donor-page {
    min-height: 80vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    background: #f5f5f5;
}

.donor-form {
    width: 100%;
    max-width: 500px;
    padding: 30px;
    background: #1a1a1a;
    color: white;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);

    display: flex;
    flex-direction: column;
    gap: 18px;
}

.donor-form h1 {
    margin: 0;
    text-align: center;
    color: #e63946;
    font-size: 30px;
}

.form-message {
    text-align: center;
    color: #aaa;
    margin: 0 0 10px;
}

.form-row {
    display: flex;
    gap: 12px;
}

.donor-form label {
    position: relative;
    width: 100%;
}

.input {
    width: 100%;
    box-sizing: border-box;
    padding: 16px 12px;
    border-radius: 10px;
    border: 1px solid #444;
    outline: none;
    background: #292929;
    color: white;
    font-size: 15px;
}

.input:focus {
    border-color: #e63946;
}

.donor-form label span {
    position: absolute;
    left: 12px;
    top: 15px;
    color: #aaa;
    pointer-events: none;
    transition: 0.2s;
}

.input:focus + span,
.input:not(:placeholder-shown) + span {
    top: -8px;
    left: 10px;
    padding: 0 5px;
    background: #1a1a1a;
    color: #e63946;
    font-size: 12px;
}

/* Dropdown */

select.input {
    color: #aaa;
    cursor: pointer;
}

select.input:focus {
    color: white;
}

select.input option {
    background: #292929;
    color: white;
}

/* Button */

.submit {
    border: none;
    padding: 13px;
    border-radius: 10px;
    background: #e63946;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.submit:hover {
    background: #c1121f;
    transform: translateY(-2px);
}

/* Mobile */

@media (max-width: 600px) {

    .form-row {
        flex-direction: column;
    }

    .donor-form {
        padding: 22px;
    }

}

</style>
<div class="donor-page">

    <form method="POST" class="donor-form">
        {% csrf_token %}

        <h1>Become a Donor 🩸</h1>
        <p class="form-message">
            Register as a blood donor and help save lives.
        </p>

        <div class="form-row">

            <label>
                <input class="input" type="text" name="full_name"
                       placeholder=" " required>
                <span>Full Name</span>
            </label>

            <label>
                <input class="input" type="number" name="age"
                       placeholder=" " required>
                <span>Age</span>
            </label>

        </div>

        <label>
            <select class="input" name="gender" required>
                <option value="">Select your gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </label>

        <label>
            <input class="input" type="email" name="email"
                   placeholder=" " required>
            <span>Email</span>
        </label>

        <label>
            <input class="input" type="text" name="loc"
                   placeholder=" " required>
            <span>Address</span>
        </label>

        <label>
            <input class="input" type="tel" name="phone"
                   placeholder=" " required>
            <span>Phone Number</span>
        </label>

        <label>
            <select class="input" name="blood_type" required>
                <option value="">Select your blood type</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
        </label>

        <button type="submit" class="submit">
            Register as Donor 🩸
        </button>

    </form>

</div>

{% endblock %}

{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodConnect</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold text-danger" href="#">
                🩸 BloodConnect
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'indexPage' %}">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'aboutPage' %}">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'findDonor' %}">Find Donor</a>
                    </li>

                <li class="nav-item">
                        <a class="nav-link" href="{% url 'becameDonor' %}">Become a Donor</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>

                    <li class="nav-item ms-lg-3">
                        <a href="{% url 'login' %}" class="btn btn-outline-danger">
                            Login
                        </a>
                    </li>

                    <li class="nav-item ms-lg-2">
                        <a href="{% url 'register' %}" class="btn btn-danger">
                            Register
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    {% block content %}
    {% endblock %}

<!-- Call To Action -->
<section class="cta-section">

    <div class="container text-center">

        <h2>Be Someone's Reason to Smile ❤️</h2>

        <p>
            One donation can make a big difference.
        </p>

        <a href="became_donor.html" class="btn btn-light btn-lg">
            Become a Donor
        </a>

    </div>

</section>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
